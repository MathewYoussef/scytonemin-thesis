name: CI Audit

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r env/requirements.txt
          pip install pytest-cov ruff
      - name: Lint with ruff
        run: |
          ruff check src/
        continue-on-error: true
      - name: Run quick tests with coverage
        run: |
          pytest tests -m "quick" --maxfail=1 --cov=src --cov-report=term --cov-report=html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
      - name: Build docs
        run: |
          mkdocs build -q
